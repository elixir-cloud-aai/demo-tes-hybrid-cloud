# Everything that must pass on pull requests and pushes to `main`. No
# `paths:` filters, so that the gate always reports. The gate `passed`
# ("CI passed") is the only check to require; add every new job to its
# `needs`.
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Only a new head commit of a pull request cancels its runs in progress
# (action `synchronize`, first attempt); runs for other actions and reruns
# wait, so that a run on the same commit never leaves a cancelled, failed
# `CI passed` (see "Cancelled runs" in `actions/gate/README.md` of
# `elixir-cloud-aai/.github`). Runs for pushes get their own group, so
# that none is dropped
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request'
    && github.event.action == 'synchronize'
    && github.run_attempt == 1 }}

jobs:
  # The notebook end to end, against the local setup (`local/compose.yaml`):
  # Funnel, proTES and S3 in containers, as in the section "Try it out
  # locally" of the README
  demo:
    name: Demo
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the demo
        run: docker compose -f local/compose.yaml run --build --rm -T demo
      - name: Show logs
        if: failure()
        run: docker compose -f local/compose.yaml logs
      # Also the executors of tasks, which Funnel starts outside of Compose
      - name: Remove containers
        if: always()
        run: |
          docker ps -aq --filter label=demo-tes-hybrid-cloud=task | xargs -r docker rm -f
          docker compose -f local/compose.yaml --profile demo down --volumes

  passed:
    name: CI passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [demo]
    permissions: {}
    steps:
      - name: Check results of all jobs
        uses: elixir-cloud-aai/.github/actions/gate@743e82d290a53768454999e413756a924e383259 # v1.0.0
        with:
          needs: ${{ toJSON(needs) }}
