name: demo-tes-hybrid-cloud
channels:
  - conda-forge
  - bioconda
dependencies:
  - bash_kernel >=0.9.0
  - curl >=7.87.0
  # Snakemake 7 lists the files of the workflow with Git for TES jobs
  - git
  - jq >=1.6
  - jupyterlab >=3.6.1
  - pip >=23.0
  - python >=3.8.16, <3.12
  - snakemake >=7.21.0, <8
  - pip:
      # 1.1.4 and later send the access token of `TES_TOKEN` if no Basic
      # credentials are set (earlier commits sent Basic credentials instead)
      - py-tes>=1.1.4
